<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0e14">
<title>Mis Gastos</title>
<style>
  /* ===== Identidad visual ===== */
  :root{
    --fondo:#0d0e14;
    --superficie:#16171f;
    --superficie-alta:#1d1f2a;
    --borde:#262838;
    --texto:#f0f1f5;
    --texto-2:#9a9db0;
    --texto-3:#62657a;
    --teal:#2ee6c5;       /* disponible / positivo */
    --violeta:#9d7bff;    /* acción / seleccionado */
    --verde:#34d399;
    --ambar:#fbbf24;
    --rojo:#f87171;
    --sombra:0 10px 30px rgba(0,0,0,.45);
    --radio:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--fondo);
    color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{
    max-width:520px;margin:0 auto;min-height:100%;
    display:flex;flex-direction:column;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ===== Encabezado / selector de mes ===== */
  .top{padding:calc(18px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between;}
  .mes-sel{display:flex;align-items:center;gap:6px;}
  .mes-sel button{background:none;border:none;color:var(--texto-2);font-size:20px;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;}
  .mes-sel button:active{background:var(--superficie-alta);}
  .mes-label{font-size:15px;font-weight:600;letter-spacing:.2px;text-transform:capitalize;min-width:120px;text-align:center;}
  .saludo{font-size:12px;color:var(--texto-3);text-transform:uppercase;letter-spacing:1.5px;}

  /* ===== Hero presupuesto ===== */
  .hero{margin:6px 16px 0;background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:22px 22px 20px;box-shadow:var(--sombra);}
  .hero .et{font-size:12px;color:var(--texto-2);text-transform:uppercase;letter-spacing:1.5px;}
  .hero .monto{font-size:42px;font-weight:700;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.05;}
  .hero .monto.ok{color:var(--teal);text-shadow:0 0 28px rgba(46,230,197,.25);}
  .hero .monto.mal{color:var(--rojo);text-shadow:0 0 28px rgba(248,113,113,.25);}
  .hero .sub{font-size:13px;color:var(--texto-2);margin-top:6px;}
  .barra{height:9px;background:var(--superficie-alta);border-radius:99px;margin-top:16px;overflow:hidden;}
  .barra > i{display:block;height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .4s;}
  .barra-info{display:flex;justify-content:space-between;font-size:12px;color:var(--texto-3);margin-top:7px;}
  .sueldo-mes{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--teal);background:rgba(46,230,197,.1);border:1px solid rgba(46,230,197,.28);padding:7px 14px;border-radius:99px;cursor:pointer;}
  .sueldo-mes:active{background:rgba(46,230,197,.22);}

  /* ===== Filtros rápidos ===== */
  .filtros{display:flex;gap:8px;padding:18px 16px 4px;}
  .filtros button{flex:1;background:var(--superficie);border:1px solid var(--borde);color:var(--texto-2);
    padding:11px 0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;}
  .filtros button.on{background:var(--violeta);border-color:var(--violeta);color:#120a26;}
  .filtros .ftot{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px;font-variant-numeric:tabular-nums;}

  /* ===== Secciones / tarjetas ===== */
  .sec{padding:8px 16px 0;}
  .sec h2{font-size:13px;color:var(--texto-2);text-transform:uppercase;letter-spacing:1.3px;margin:14px 4px 10px;}
  .card{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;margin-bottom:12px;}

  /* lista de movimientos */
  .mov{display:flex;align-items:center;gap:13px;padding:11px 4px;}
  .mov + .mov{border-top:1px solid var(--borde);}
  .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;}
  .mov .desc{flex:1;min-width:0;}
  .mov .desc b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mov .desc span{font-size:12px;color:var(--texto-3);}
  .mov .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;flex:none;}
  .mov .val.gasto{color:var(--texto);}
  .mov .val.ingreso{color:var(--teal);}
  .mov .borrar{background:none;border:none;color:var(--texto-3);font-size:18px;width:30px;height:30px;border-radius:8px;cursor:pointer;flex:none;}
  .mov .borrar:active{background:var(--superficie-alta);color:var(--rojo);}
  .mov-tap{flex:1;display:flex;align-items:center;gap:13px;min-width:0;cursor:pointer;}
  .mov-tap:active{opacity:.6;}
  .ley-row{cursor:pointer;}
  .ley-row:active{background:var(--superficie-alta);}
  .chev{color:var(--texto-3);margin-left:8px;font-size:18px;}
  .medios{display:flex;gap:8px;margin-bottom:18px;}
  .medios button{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--borde);background:var(--superficie-alta);color:var(--texto-2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .medios button.on{background:var(--violeta);border-color:var(--violeta);color:#120a26;}
  .tag-tarjeta{background:rgba(91,157,255,.16);color:#5b9dff;}
  /* atajos */
  .atajos-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;}
  .atajos-row::-webkit-scrollbar{display:none;}
  .atajo-chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--superficie);border:1px solid var(--borde);border-radius:14px;padding:9px 14px;cursor:pointer;font-family:inherit;color:var(--texto);min-width:94px;}
  .atajo-chip:active{background:var(--superficie-alta);transform:scale(.97);}
  .atajo-chip .ae{font-size:18px;}
  .atajo-chip .an{font-size:12px;color:var(--texto-2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
  .atajo-chip .am{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .atajo-chip.nuevo{justify-content:center;align-items:center;color:var(--teal);border-style:dashed;font-weight:600;font-size:13px;min-width:80px;}
  /* cajitas del plan */
  .caj-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;}
  .caj-nom{font-size:15px;font-weight:600;}
  .caj-val{font-size:12px;color:var(--texto-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .caj-sub{font-size:12px;color:var(--texto-3);margin-top:8px;}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;}
  .meta-row b{font-variant-numeric:tabular-nums;}
  .meta-sub{font-size:12px;color:var(--texto-3);margin-top:3px;}
  .plan-cfg{display:flex;gap:10px;margin-bottom:14px;}
  .plan-cfg label{flex:1;font-size:12px;color:var(--texto-2);display:flex;flex-direction:column;gap:6px;}
  .input.mini{padding:11px 6px;font-size:16px;text-align:center;}
  /* gestión en ajustes */
  .gest-item{display:flex;align-items:center;gap:11px;padding:10px 2px;}
  .gest-item + .gest-item{border-top:1px solid var(--borde);}
  .gi-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;}
  .gi-nom{flex:1;font-size:15px;min-width:0;}
  .gi-x{background:none;border:none;color:var(--texto-3);font-size:19px;cursor:pointer;width:32px;height:32px;border-radius:8px;flex:none;}
  .gi-x:active{background:var(--superficie-alta);}
  .tag-nd{font-size:10px;padding:1px 7px;border-radius:99px;margin-left:7px;vertical-align:middle;}
  .tag-nec{background:rgba(52,211,153,.15);color:var(--verde);}
  .tag-des{background:rgba(157,123,255,.18);color:var(--violeta);}

  .vacio{text-align:center;padding:34px 16px;color:var(--texto-3);}
  .vacio .em{font-size:40px;display:block;margin-bottom:10px;}
  .vacio b{color:var(--texto-2);font-weight:600;}

  /* ===== Gráfico de torta ===== */
  .torta-wrap{display:flex;flex-direction:column;align-items:center;}
  .donut{position:relative;width:200px;height:200px;}
  .donut svg{transform:rotate(-90deg);}
  .donut .centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
  .donut .centro small{font-size:11px;color:var(--texto-3);text-transform:uppercase;letter-spacing:1px;}
  .donut .centro b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-top:2px;}
  @keyframes draw{from{stroke-dashoffset:var(--len);}to{stroke-dashoffset:0;}}
  .seg{animation:draw .8s cubic-bezier(.3,.8,.3,1) forwards;}
  .leyenda{width:100%;margin-top:8px;}
  .leyenda .row{display:flex;align-items:center;gap:11px;padding:9px 2px;}
  .leyenda .row + .row{border-top:1px solid var(--borde);}
  .punto{width:11px;height:11px;border-radius:4px;flex:none;}
  .leyenda .nom{flex:1;font-size:14px;}
  .leyenda .pct{font-size:12px;color:var(--texto-3);font-variant-numeric:tabular-nums;}
  .leyenda .pl{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px;}

  /* balance necesidad vs deseo */
  .nd{display:flex;height:34px;border-radius:12px;overflow:hidden;margin-top:6px;font-size:12px;font-weight:600;}
  .nd .n{background:rgba(52,211,153,.22);color:var(--verde);display:grid;place-items:center;transition:width .6s;}
  .nd .d{background:rgba(157,123,255,.22);color:var(--violeta);display:grid;place-items:center;transition:width .6s;}

  /* ===== Consejos ===== */
  .consejo{display:flex;gap:13px;padding:14px;border-radius:16px;margin-bottom:11px;border:1px solid var(--borde);background:var(--superficie);}
  .consejo .cem{font-size:22px;flex:none;}
  .consejo p{font-size:14px;line-height:1.45;color:var(--texto);}
  .consejo.alerta{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.07);}
  .consejo.bien{border-color:rgba(46,230,197,.35);background:rgba(46,230,197,.06);}

  /* logros */
  .logros{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .logro{background:var(--superficie);border:1px solid var(--borde);border-radius:16px;padding:15px;text-align:center;transition:.2s;}
  .logro.on{border-color:var(--violeta);background:linear-gradient(160deg,rgba(157,123,255,.14),var(--superficie));}
  .logro .le{font-size:30px;filter:grayscale(1);opacity:.35;}
  .logro.on .le{filter:none;opacity:1;}
  .logro b{display:block;font-size:13px;margin-top:8px;}
  .logro span{display:block;font-size:11px;color:var(--texto-3);margin-top:3px;line-height:1.3;}

  /* ===== Ajustes ===== */
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:13px;color:var(--texto-2);margin-bottom:7px;}
  .input{width:100%;background:var(--superficie-alta);border:1px solid var(--borde);color:var(--texto);
    font-size:17px;padding:14px;border-radius:14px;font-variant-numeric:tabular-nums;outline:none;font-family:inherit;}
  .input:focus{border-color:var(--violeta);}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-pri{background:var(--teal);color:#06231c;}
  .btn-sec{background:var(--superficie-alta);color:var(--texto);border:1px solid var(--borde);margin-top:10px;}
  .btn-peli{background:rgba(248,113,113,.12);color:var(--rojo);border:1px solid rgba(248,113,113,.3);margin-top:10px;}
  .ayuda{font-size:12px;color:var(--texto-3);line-height:1.5;margin-top:6px;}

  /* ===== FAB + nav inferior ===== */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
    width:60px;height:60px;border-radius:50%;border:none;background:linear-gradient(145deg,var(--teal),var(--violeta));
    color:#0d0e14;font-size:32px;font-weight:300;cursor:pointer;box-shadow:0 8px 24px rgba(46,230,197,.35);z-index:30;display:grid;place-items:center;}
  .fab:active{transform:translateX(-50%) scale(.92);}
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,14,20,.9);backdrop-filter:blur(14px);
    border-top:1px solid var(--borde);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20;}
  .nav .tab{flex:1;background:none;border:none;color:var(--texto-3);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;}
  .nav .tab .ti{font-size:21px;}
  .nav .tab.on{color:var(--teal);}

  /* ===== Hoja para cargar (bottom sheet) ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.25s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .hoja{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--superficie);
    border-radius:26px 26px 0 0;border-top:1px solid var(--borde);padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;}
  .hoja.show{transform:translateY(0);}
  .grip{width:42px;height:5px;background:var(--borde);border-radius:99px;margin:6px auto 16px;}
  .toggle-tipo{display:flex;gap:8px;margin-bottom:18px;}
  .toggle-tipo button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--borde);background:var(--superficie-alta);color:var(--texto-2);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
  .toggle-tipo button.on{background:var(--violeta);border-color:var(--violeta);color:#120a26;}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .cat-chip{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;border:1px solid var(--borde);background:var(--superficie-alta);cursor:pointer;font-size:13px;color:var(--texto-2);}
  .cat-chip.on{border-color:var(--violeta);color:var(--texto);background:rgba(157,123,255,.14);}
  .nd-switch{display:flex;align-items:center;justify-content:space-between;background:var(--superficie-alta);border:1px solid var(--borde);border-radius:14px;padding:13px 16px;margin-bottom:18px;}
  .nd-switch .sw{display:flex;gap:6px;}
  .nd-switch .sw button{padding:7px 14px;border-radius:10px;border:1px solid var(--borde);background:transparent;color:var(--texto-2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .nd-switch .sw button.on-nec{background:rgba(52,211,153,.2);border-color:var(--verde);color:var(--verde);}
  .nd-switch .sw button.on-des{background:rgba(157,123,255,.2);border-color:var(--violeta);color:var(--violeta);}

  .toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--superficie-alta);border:1px solid var(--borde);color:var(--texto);padding:12px 20px;border-radius:99px;font-size:14px;
    z-index:60;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sombra);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

  <div class="toggle-tipo">
    <button id="btGasto" class="on" onclick="setTipo('gasto')">Gasto</button>
    <button id="btIngreso" onclick="setTipo('ingreso')">Ingreso extra</button>
  </div>
  <div class="campo">
    <label>Monto</label>
    <input class="input" id="inMonto" type="number" inputmode="numeric" placeholder="0" style="font-size:24px;font-weight:700;">
  </div>
  <div class="campo">
    <label>Descripción</label>
    <input class="input" id="inDesc" type="text" placeholder="Ej: café con leche">
  </div>
  <div id="zonaGasto">
    <label style="font-size:13px;color:var(--texto-2);display:block;margin-bottom:7px;">Categoría</label>
    <div class="cats" id="cats"></div>

      <span style="font-size:14px;color:var(--texto-2);">¿Qué tipo de gasto?</span>

    <div class="medios" id="medios"></div>
  </div>
  <div class="campo">
    <label>Fecha</label>
    <input class="input" id="inFecha" type="date">
  </div>

  <button id="btBorrarMov" class="btn btn-peli" style="display:none" onclick="borrarDesdeHoja()">Borrar este movimiento</button>
</div>

  <div class="campo"><label>Monto fijo</label><input class="input" id="atMonto" type="number" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:700"></div>

  <label style="font-size:13px;color:var(--texto-2);display:block;margin-bottom:7px">Medio de pago</label>
  <div class="medios" id="atMedios"></div>

</div>

<script>
/* ============================================================
   Mis Gastos — app personal, todo local en el celular.
   Sin servidores, sin publicidad, funciona sin internet.
   ============================================================ */

// --- Categorías con su ícono y color (los "grafiquitos") ---
const DEFAULT_CATS = [
  {k:'comida',     n:'Comida',          em:'🍔', c:'#ff8a5c'},
  {k:'transporte', n:'Transporte',      em:'🚌', c:'#5b9dff'},
  {k:'ocio',       n:'Entretenimiento', em:'🎬', c:'#9d7bff'},
  {k:'servicios',  n:'Servicios',       em:'💡', c:'#fbbf24'},
  {k:'salud',      n:'Salud',           em:'🏥', c:'#ff6b9d'},
  {k:'ropa',       n:'Ropa',            em:'👕', c:'#2ee6c5'},
  {k:'varios',     n:'Varios',          em:'💰', c:'#94a3b8'},
];
const PALETA = ['#ff8a5c','#5b9dff','#9d7bff','#fbbf24','#ff6b9d','#2ee6c5','#34d399','#f87171','#e879f9','#94a3b8'];
function cats(){ return (state.cats && state.cats.length) ? state.cats : DEFAULT_CATS; }
const catDe = k => cats().find(c=>c.k===k) || {k:k,n:'Otros',em:'💸',c:'#94a3b8'};

// --- Estado y persistencia ---
let state = {sueldo:0, movs:[]};
let usaLocal = true;
function cargar(){
  try{
    const raw = localStorage.getItem('misGastos');
    if(raw) state = JSON.parse(raw);
  }catch(e){ usaLocal=false; } // si el navegador bloquea, seguimos en memoria
  ensureShape();
}
// Completa campos nuevos sin tocar lo ya cargado (categorías, atajos, plan).
function ensureShape(){
  if(!Array.isArray(state.movs)) state.movs=[];
  if(!Array.isArray(state.cats)||!state.cats.length) state.cats=DEFAULT_CATS.map(c=>({...c}));
  if(!Array.isArray(state.atajos)) state.atajos=[];
  if(!state.plan) state.plan={activo:true,pNec:50,pGus:30,pAho:20};
  if(state.arrastre===undefined) state.arrastre=true;
  // Sueldo por mes. Si venías con un sueldo único, lo paso al mes actual (una sola vez).
  if(!state.sueldos){
    state.sueldos={};
    if(typeof state.sueldo==='number' && state.sueldo>0){
      state.sueldos[hoyStr().slice(0,7)]=state.sueldo;
    }
  }
}
// Sueldo del mes pedido (0 si no lo cargaste). Cada mes es independiente.
function sueldoDe(ym){ return (state.sueldos && state.sueldos[ym]) || 0; }
function guardar(){
  if(!usaLocal) return;
  try{ localStorage.setItem('misGastos', JSON.stringify(state)); }catch(e){ usaLocal=false; }
}

// --- Helpers de fecha ---
function hoyStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
let mesVista = hoyStr().slice(0,7); // 'YYYY-MM'
function nombreMes(ym){
  const [a,m]=ym.split('-');
  const d=new Date(+a,+m-1,1);
  return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
}
function diasDelMes(ym){const [a,m]=ym.split('-');return new Date(+a,+m,0).getDate();}

// --- Formato plata (pesos) ---
const fmt = new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const plata = n => fmt.format(Math.round(n||0));

// --- Cálculos del mes en vista ---
function movsMes(ym){ return state.movs.filter(m=>m.fecha.slice(0,7)===ym); }
function gastosMes(ym){ return movsMes(ym).filter(m=>m.tipo==='gasto').reduce((s,m)=>s+m.monto,0); }
function ingresosExtraMes(ym){ return movsMes(ym).filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+m.monto,0); }
function ingresoTotalMes(ym){ return sueldoDe(ym) + ingresosExtraMes(ym); }
function disponibleMes(ym){ return ingresoTotalMes(ym) - gastosMes(ym); }
// Meses que tienen algún dato (sueldo cargado o movimientos).
function mesesConDatos(){
  const set=new Set(Object.keys(state.sueldos||{}));
  state.movs.forEach(m=>set.add(m.fecha.slice(0,7)));
  return [...set].sort();
}
// Arrastre: el saldo neto de todos los meses anteriores a ym (si está activado).
function arrastreDe(ym){
  if(state.arrastre===false) return 0;
  return mesesConDatos().filter(m=>m<ym).reduce((s,m)=>s+disponibleMes(m),0);
}
// Saldo acumulado: arrastre de meses anteriores + lo de este mes.
function saldoAcumuladoDe(ym){ return arrastreDe(ym)+disponibleMes(ym); }

// ============================================================
//  NAVEGACIÓN
// ============================================================
let tabActual='inicio';
function irA(t){
  tabActual=t;
  document.querySelectorAll('.nav .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  render();
}
function cambiarMes(d){
  let [a,m]=mesVista.split('-').map(Number);
  m+=d; if(m<1){m=12;a--;} if(m>12){m=1;a++;}
  mesVista=a+'-'+String(m).padStart(2,'0');
  render();
}

// ============================================================
//  RENDER
// ============================================================
let filtro='mes'; // hoy | semana | mes
function render(){
  document.getElementById('mesLabel').textContent=nombreMes(mesVista);
  const v=document.getElementById('vista');
  if(tabActual==='inicio') v.innerHTML=vistaInicio();
  else if(tabActual==='plan') v.innerHTML=vistaPlan();
  else if(tabActual==='graficos') v.innerHTML=vistaGraficos();
  else if(tabActual==='consejos') v.innerHTML=vistaConsejos();
  else if(tabActual==='ajustes') v.innerHTML=vistaAjustes();
  guardar();
}

// ---------- INICIO ----------
function vistaInicio(){
  const s=sueldoDe(mesVista);
  const ing=ingresoTotalMes(mesVista), gas=gastosMes(mesVista);
  const netoM=disponibleMes(mesVista);     // solo este mes
  const arr=arrastreDe(mesVista);          // meses anteriores
  const saldo=arr+netoM;                   // acumulado (el número grande)
  const pct = ing>0 ? Math.min(100,(gas/ing)*100) : 0;
  let color=var2('--verde'); if(pct>=90)color=var2('--rojo'); else if(pct>=70)color=var2('--ambar');
  const sinSueldo = s<=0;

  // filtros
  const t=hoyStr();
  const totHoy=state.movs.filter(m=>m.tipo==='gasto'&&m.fecha===t).reduce((s,m)=>s+m.monto,0);
  const hace7=new Date(); hace7.setDate(hace7.getDate()-6);
  const totSem=state.movs.filter(m=>m.tipo==='gasto'&&new Date(m.fecha+'T00:00')>=new Date(hace7.toDateString())).reduce((s,m)=>s+m.monto,0);

  let html=`
  <div class="hero">
    <div class="et">${arr!==0?'Saldo disponible':'Disponible en '+nombreMes(mesVista)}</div>
    <div class="monto ${saldo<0?'mal':'ok'}">${plata(saldo)}</div>
    <div class="sueldo-mes" onclick="editarSueldoMes()">${sinSueldo?'➕ Cargá el sueldo de este mes':'💵 Sueldo: '+plata(s)+' · editar'}</div>
    ${arr!==0
      ? `<div class="sub">Arrastre de meses anteriores: ${plata(arr)} · en ${nombreMes(mesVista)} llevás ${plata(netoM)}</div>`
      : (sinSueldo?'<div class="sub">Poné el sueldo de este mes (sumale aguinaldo, feriados, etc.) 👆</div>':`<div class="sub">Gastaste ${plata(gas)} de ${plata(ing)}</div>`)}
    <div class="barra"><i style="width:${pct}%;background:${color}"></i></div>
    <div class="barra-info"><span>${pct.toFixed(0)}% usado en ${nombreMes(mesVista)}</span><span>${pct>=90?'¡Ojo, casi al límite!':pct>=70?'Tranqui, todavía hay':'Vas holgado'}</span></div>
  </div>
  <div class="filtros">
    <button class="${filtro==='hoy'?'on':''}" onclick="setFiltro('hoy')">Hoy<span class="ftot">${plata(totHoy)}</span></button>
    <button class="${filtro==='semana'?'on':''}" onclick="setFiltro('semana')">Semana<span class="ftot">${plata(totSem)}</span></button>
    <button class="${filtro==='mes'?'on':''}" onclick="setFiltro('mes')">Mes<span class="ftot">${plata(gas)}</span></button>
  </div>
  ${seccionAtajos()}
  <div class="sec"><h2>Movimientos</h2>${listaMovs()}</div>`;
  return html;
}
// Chips de gastos repetitivos: un toque y se carga con fecha de hoy.
function seccionAtajos(){
  const chips=(state.atajos||[]).map(a=>{
    const c=catDe(a.categoria);
    return `<button class="atajo-chip" onclick="usarAtajo(${a.id})">
      <span class="ae">${c.em}</span><span class="an">${escape(a.desc)||c.n}</span><span class="am">${plata(a.monto)}</span></button>`;
  }).join('');
  return `<div class="sec"><h2>Atajos</h2>
    <div class="atajos-row">${chips}
      <button class="atajo-chip nuevo" onclick="abrirAtajoHoja()">＋ Nuevo</button>
    </div></div>`;
}
function setFiltro(f){filtro=f;render();}
// Carga o edita el sueldo del mes que estás viendo. Cada mes es independiente.
function editarSueldoMes(){
  const ym=mesVista, actual=state.sueldos[ym]||'';
  const v=prompt('Sueldo de '+nombreMes(ym)+'\n(sumale aguinaldo, feriados trabajados, etc.)\nPonelo en 0 o dejalo vacío para borrarlo:', actual);
  if(v===null) return;
  const n=parseFloat(v);
  if(!n||n<=0){ delete state.sueldos[ym]; toast('Sueldo del mes borrado'); }
  else { state.sueldos[ym]=n; toast('Sueldo de '+nombreMes(ym)+' guardado'); }
  guardar(); render();
}

function listaMovs(){
  let lista;
  if(filtro==='hoy'){ const t=hoyStr(); lista=state.movs.filter(m=>m.fecha===t); }
  else if(filtro==='semana'){ const h=new Date();h.setDate(h.getDate()-6); lista=state.movs.filter(m=>new Date(m.fecha+'T00:00')>=new Date(h.toDateString())); }
  else lista=movsMes(mesVista);
  lista=[...lista].sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.id-a.id);

  if(!lista.length) return `<div class="vacio"><span class="em">🧉</span><b>Nada por acá todavía</b><br>Tocá el botón + para cargar tu primer movimiento.</div>`;

  return `<div class="card">${lista.map(renderMovCard).join('')}</div>`;
}

// Tarjeta de un movimiento (se usa en la lista y en el detalle por categoría).
// Tocar la fila abre la edición; la × borra.
function renderMovCard(m){
  const c=catDe(m.categoria);
  const esG=m.tipo==='gasto';
  const ico=esG?c.em:'💵';
  const bg=esG?c.c+'22':'rgba(46,230,197,.15)';
  const tag = esG ? `<span class="tag-nd ${m.nec?'tag-nec':'tag-des'}">${m.nec?'necesidad':'antojo'}</span>`:'';
  const tagT = (esG && m.medio==='tarjeta') ? `<span class="tag-nd tag-tarjeta">💳 tarjeta</span>`:'';
  const f=new Date(m.fecha+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  return `<div class="mov">
    <div class="mov-tap" onclick="editarMov(${m.id})">
      <div class="ico" style="background:${bg}">${ico}</div>
      <div class="desc"><b>${escape(m.desc)||(esG?c.n:'Ingreso')}</b><span>${f}${esG?' · '+c.n:''}${tag}${tagT}</span></div>
      <div class="val ${m.tipo}">${esG?'-':'+'}${plata(m.monto)}</div>
    </div>
    <button class="borrar" onclick="borrar(${m.id})">×</button>
  </div>`;
}

// ---------- DETALLE (por categoría o por tarjeta) ----------
let detModo=null;   // 'cat' | 'tarjeta'
let catDetalle=null;
function verCategoria(k){ detModo='cat'; catDetalle=k; abrirDetalle(); }
function verTarjeta(){ detModo='tarjeta'; catDetalle=null; abrirDetalle(); }
function abrirDetalle(){
  renderDetalle();
  document.getElementById('detOverlay').classList.add('show');
  document.getElementById('detHoja').classList.add('show');
}
function cerrarDetalle(){
  detModo=null; catDetalle=null;
  document.getElementById('detOverlay').classList.remove('show');
  document.getElementById('detHoja').classList.remove('show');
}
function renderDetalle(){
  if(!detModo) return;
  let lista, cab;
  if(detModo==='tarjeta'){
    lista=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.medio==='tarjeta');
    const tot=lista.reduce((s,m)=>s+m.monto,0);
    cab=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <div class="ico" style="background:rgba(91,157,255,.18)">💳</div>
      <div style="flex:1"><b style="font-size:17px">Tarjeta</b>
        <div style="font-size:13px;color:var(--texto-3)">${lista.length} gasto${lista.length!==1?'s':''} · ${nombreMes(mesVista)}</div></div>
      <b style="font-size:18px;font-variant-numeric:tabular-nums">${plata(tot)}</b></div>
      <p style="font-size:12px;color:var(--texto-3);margin:8px 4px 10px">Todo lo que pagaste con tarjeta este mes. Tocá un ítem para corregirlo.</p>`;
  }else{
    const c=catDe(catDetalle);
    lista=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.categoria===catDetalle);
    const tot=lista.reduce((s,m)=>s+m.monto,0);
    cab=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <div class="ico" style="background:${c.c}22">${c.em}</div>
      <div style="flex:1"><b style="font-size:17px">${c.n}</b>
        <div style="font-size:13px;color:var(--texto-3)">${lista.length} gasto${lista.length!==1?'s':''} · ${nombreMes(mesVista)}</div></div>
      <b style="font-size:18px;font-variant-numeric:tabular-nums">${plata(tot)}</b></div>
      <p style="font-size:12px;color:var(--texto-3);margin:8px 4px 10px">Tocá un gasto para editarlo, corregir el monto o cambiarlo de categoría.</p>`;
  }
  lista=[...lista].sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.id-a.id);
  document.getElementById('detContenido').innerHTML = cab +
    (lista.map(renderMovCard).join('')||'<div class="vacio" style="padding:18px">Nada por acá este mes.</div>');
}

// ---------- GRÁFICOS ----------
function vistaGraficos(){
  const gas=gastosMes(mesVista);
  if(gas===0) return `<div class="sec"><div class="vacio"><span class="em">📊</span><b>Sin gastos este mes</b><br>Cuando cargues algunos, vas a ver acá la torta por categoría.</div></div>`;

  // totales por categoría
  const porCat={};
  movsMes(mesVista).filter(m=>m.tipo==='gasto').forEach(m=>{ porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto; });
  const items=Object.entries(porCat).map(([k,v])=>({...catDe(k),v,pct:v/gas})).sort((a,b)=>b.v-a.v);

  // donut SVG
  const r=80, circ=2*Math.PI*r; let off=0;
  const segs=items.map(it=>{
    const len=it.pct*circ;
    const s=`<circle class="seg" cx="100" cy="100" r="${r}" fill="none" stroke="${it.c}" stroke-width="26"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="0"
      transform="rotate(${(off/circ)*360} 100 100)" style="--len:${len}"></circle>`;
    off+=len; return s;
  }).join('');

  // necesidad vs deseo
  const nec=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.nec).reduce((s,m)=>s+m.monto,0);
  const des=gas-nec;
  const pNec=(nec/gas)*100, pDes=(des/gas)*100;

  return `
  <div class="sec">
    <h2>Adónde se fue la plata</h2>
    <div class="card torta-wrap">
      <div class="donut">
        <svg width="200" height="200" viewBox="0 0 200 200">${segs}</svg>
        <div class="centro"><small>Gastado</small><b>${plata(gas)}</b></div>
      </div>
      <div class="leyenda">${items.map(it=>`
        <div class="row ley-row" onclick="verCategoria('${it.k}')">
          <span class="punto" style="background:${it.c}"></span>
          <span class="nom">${it.em} ${it.n}</span>
          <span class="pct">${(it.pct*100).toFixed(0)}%</span>
          <span class="pl">${plata(it.v)}</span>
          <span class="chev">›</span>
        </div>`).join('')}
      </div>
      <p style="font-size:12px;color:var(--texto-3);text-align:center;margin-top:10px">Tocá una categoría para ver el detalle 👆</p>
    </div>
    <h2>Necesidad vs. antojo</h2>
    <div class="card">
      <div class="nd">
        <div class="n" style="width:${pNec}%">${pNec>12?Math.round(pNec)+'%':''}</div>
        <div class="d" style="width:${pDes}%">${pDes>12?Math.round(pDes)+'%':''}</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;">
        <span style="color:var(--verde)">Necesidad · ${plata(nec)}</span>
        <span style="color:var(--violeta)">Antojo · ${plata(des)}</span>
      </div>
    </div>
    ${(()=>{ 
      const tj=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.medio==='tarjeta').reduce((s,m)=>s+m.monto,0);
      if(tj<=0) return '';
      const p=(tj/gas*100).toFixed(0);
      return `<h2>Pagado con tarjeta</h2>
      <div class="card ley-row" onclick="verTarjeta()" style="display:flex;align-items:center;gap:12px">
        <div class="ico" style="background:rgba(91,157,255,.18)">💳</div>
        <div style="flex:1"><b style="font-size:16px">${plata(tj)}</b>
          <div style="font-size:12px;color:var(--texto-3)">${p}% de lo que gastaste este mes</div></div>
        <span class="chev">›</span>
      </div>`;
    })()}
  </div>`;
}

// ---------- PLAN (cajitas con destino) ----------
function vistaPlan(){
  const s=sueldoDe(mesVista);
  if(s<=0) return `<div class="sec"><div class="vacio"><span class="em">🎯</span><b>Cargá el sueldo de ${nombreMes(mesVista)}</b><br>Tocá el sueldo arriba en Inicio y armo tu plan de cajitas 🎯</div></div>`;
  const p=state.plan;
  const topeNec=s*p.pNec/100, topeGus=s*p.pGus/100, metaAho=s*p.pAho/100;
  const gastoNec=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.nec).reduce((x,m)=>x+m.monto,0);
  const gastoGus=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&!m.nec).reduce((x,m)=>x+m.monto,0);
  const disp=disponibleMes(mesVista);
  const fondo=s*6, rentas=s*120;
  return `<div class="sec">
    <h2>Tu plan del mes</h2>
    <p style="font-size:13px;color:var(--texto-2);margin:0 4px 12px;line-height:1.5">Reparto tu sueldo de ${plata(s)} en cajitas con destino (regla ${p.pNec}/${p.pGus}/${p.pAho}). Cada barra te muestra cuánto llevás y cuánto te queda.</p>
    ${cajita('🏠','Necesidades / fijos',gastoNec,topeNec,'gasto','alquiler, servicios, comida')}
    ${cajita('🎈','Gustos / variables',gastoGus,topeGus,'gasto','salidas, antojos')}
    ${cajita('🐷','Ahorro / inversión',Math.max(0,disp),metaAho,'ahorro','lo que te sobra apartar')}
    <h2>Metas de largo plazo</h2>
    <div class="card">
      <div class="meta-row"><span>🛟 Fondo de tranquilidad</span><b>${plata(fondo)}</b></div>
      <div class="meta-sub">6 sueldos guardados: tu colchón para medio año sin ingresos.</div>
      <div class="meta-row" style="margin-top:14px"><span>🌴 Vivir de rentas</span><b>${plata(rentas)}</b></div>
      <div class="meta-sub">120 sueldos invertidos: la meta lejana para vivir de la renta.</div>
    </div>
    <h2>Ajustar plan</h2>
    <div class="card">
      <div class="plan-cfg">
        <label>Necesidades %<input id="pNec" class="input mini" type="number" inputmode="numeric" value="${p.pNec}"></label>
        <label>Gustos %<input id="pGus" class="input mini" type="number" inputmode="numeric" value="${p.pGus}"></label>
        <label>Ahorro %<input id="pAho" class="input mini" type="number" inputmode="numeric" value="${p.pAho}"></label>
      </div>
      <button class="btn btn-pri" onclick="guardarPlan()">Guardar plan</button>
      <p class="ayuda">Lo ideal es que sumen 100. El clásico es 50 / 30 / 20.</p>
    </div>
  </div>`;
}
function cajita(em,nom,usado,tope,modo,sub){
  const pct=tope>0?Math.min(100,(usado/tope)*100):0;
  let color=var2('--verde');
  if(modo==='gasto'){ if(pct>=90)color=var2('--rojo'); else if(pct>=75)color=var2('--ambar'); }
  else { color = usado>=tope ? var2('--verde') : var2('--teal'); }
  const rest=tope-usado;
  const pie = modo==='gasto'
    ? (rest>=0?`Te quedan ${plata(rest)} en esta cajita`:`Te pasaste ${plata(-rest)}`)
    : (usado>=tope?`¡Meta cumplida! Apartaste ${plata(usado)}`:`Faltan ${plata(rest)} para la meta`);
  return `<div class="card">
    <div class="caj-top"><span class="caj-nom">${em} ${nom}</span><span class="caj-val">${plata(usado)} / ${plata(tope)}</span></div>
    <div class="barra"><i style="width:${pct}%;background:${color}"></i></div>
    <div class="caj-sub">${pie} · ${sub}</div>
  </div>`;
}
function guardarPlan(){
  const n=+document.getElementById('pNec').value||0;
  const g=+document.getElementById('pGus').value||0;
  const a=+document.getElementById('pAho').value||0;
  state.plan={activo:true,pNec:n,pGus:g,pAho:a};
  guardar(); toast((n+g+a===100)?'Plan guardado':'Guardado (no suma 100%)'); render();
}

// ---------- CONSEJOS + LOGROS ----------
function vistaConsejos(){
  return `<div class="sec"><h2>Consejos</h2>${consejos()}<h2>Logros</h2>${logros()}</div>`;
}
function consejos(){
  const ing=ingresoTotalMes(mesVista), gas=gastosMes(mesVista), disp=disponibleMes(mesVista);
  const out=[];
  if(sueldoDe(mesVista)<=0){
    out.push({em:'🧭',t:'alerta',m:`Todavía no cargaste el sueldo de ${nombreMes(mesVista)}. Tocá el sueldo arriba en Inicio y ahí sí te digo hasta dónde podés estirar el mes.`});
    return out.map(render_consejo).join('');
  }
  const pct=ing>0?(gas/ing)*100:0;
  // ritmo de gasto
  if(mesVista===hoyStr().slice(0,7)){
    const dia=new Date().getDate(), dias=diasDelMes(mesVista), restan=dias-dia;
    if(disp<0) out.push({em:'🚨',t:'alerta',m:`Ya te pasaste del presupuesto del mes por ${plata(-disp)}. Conviene frenar los gastos variables hasta que cobres.`});
    else if(restan>0) out.push({em:'📆',t:'',m:`Te quedan ${restan} día${restan>1?'s':''} y ${plata(disp)} disponibles: podés gastar hasta ${plata(disp/restan)} por día para llegar holgado.`});
  }
  // categoría más cara
  if(gas>0){
    const porCat={}; movsMes(mesVista).filter(m=>m.tipo==='gasto').forEach(m=>porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto);
    const top=Object.entries(porCat).sort((a,b)=>b[1]-a[1])[0];
    const c=catDe(top[0]), p=(top[1]/gas*100).toFixed(0);
    out.push({em:c.em,t:'',m:`Lo que más te llevó plata fue ${c.n}: ${plata(top[1])} (${p}% del total). Si querés recortar, es el primer lugar para mirar.`});
  }
  // antojos
  const nec=movsMes(mesVista).filter(m=>m.tipo==='gasto'&&m.nec).reduce((s,m)=>s+m.monto,0);
  const pDes=gas>0?((gas-nec)/gas)*100:0;
  if(pDes>=40) out.push({em:'🍦',t:'',m:`El ${pDes.toFixed(0)}% de tus gastos fueron antojos. No está mal date gustos, pero ahí hay margen fácil si necesitás apretar.`});
  // estado general
  if(pct<60 && gas>0) out.push({em:'👏',t:'bien',m:`Vas muy bien: gastaste solo el ${pct.toFixed(0)}% de lo que entró. Si seguís así, te sobra para ahorrar.`});
  else if(pct>=90) out.push({em:'⚠️',t:'alerta',m:`Gastaste el ${pct.toFixed(0)}% de tus ingresos del mes. Estás al límite, cuidá lo que viene.`});

  return out.map(render_consejo).join('');
}
function render_consejo(c){return `<div class="consejo ${c.t}"><span class="cem">${c.em}</span><p>${c.m}</p></div>`;}

function logros(){
  const gas=gastosMes(mesVista), ing=ingresoTotalMes(mesVista);
  const tieneMov=state.movs.length>0;
  const conDesc=state.movs.filter(m=>m.desc&&m.desc.trim()).length;
  const diasDistintos=new Set(state.movs.map(m=>m.fecha)).size;
  // racha sin antojos (días seguidos terminando hoy sin gasto de antojo)
  let racha=0; const d=new Date();
  for(let i=0;i<60;i++){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const hayAntojo=state.movs.some(m=>m.fecha===ds&&m.tipo==='gasto'&&!m.nec);
    if(hayAntojo) break;
    racha++; d.setDate(d.getDate()-1);
  }
  const L=[
    {em:'🚀',n:'Arranque',d:'Cargaste tu primer movimiento',on:tieneMov},
    {em:'💵',n:'Sueldo listo',d:'Cargaste el sueldo de algún mes',on:Object.keys(state.sueldos||{}).length>0},
    {em:'🔥',n:'Sin antojos',d:`${racha} día${racha!==1?'s':''} seguidos sin antojos`,on:racha>=3},
    {em:'📝',n:'Detallista',d:'10 gastos con descripción',on:conDesc>=10},
    {em:'🗓️',n:'Constante',d:'Registraste 7 días distintos',on:diasDistintos>=7},
    {em:'🐷',n:'Ahorrador',d:'Gastaste menos del 80% del mes',on:ing>0&&gas>0&&gas<ing*0.8},
  ];
  return `<div class="logros">${L.map(l=>`<div class="logro ${l.on?'on':''}"><div class="le">${l.em}</div><b>${l.n}</b><span>${l.d}</span></div>`).join('')}</div>`;
}

// ---------- AJUSTES ----------
function vistaAjustes(){
  const cargados=Object.keys(state.sueldos||{}).sort();
  return `<div class="sec">
    <h2>Tu sueldo</h2>
    <div class="card">
      <p class="ayuda" style="margin-top:0">El sueldo se carga <b>por mes</b>, desde Inicio: tocá el sueldo arriba de todo y ponele el monto real de ese mes (con aguinaldo, feriados, vacaciones, lo que sea). Cada mes es independiente y arranca vacío.</p>
      ${cargados.length?`<div style="margin-top:6px">${cargados.map(ym=>`<div class="gest-item"><span class="gi-nom" style="text-transform:capitalize">${nombreMes(ym)}</span><b style="font-variant-numeric:tabular-nums">${plata(state.sueldos[ym])}</b></div>`).join('')}</div>`:'<p class="ayuda">Todavía no cargaste el sueldo de ningún mes.</p>'}
    </div>

    <h2>Cómo cuenta el saldo</h2>
    <div class="card">
      <div class="nd-switch">
        <span style="font-size:14px;color:var(--texto-2)">Arrastrar saldo entre meses</span>
        <div class="sw">
          <button class="${state.arrastre!==false?'on-nec':''}" onclick="setArrastre(true)">Sí</button>
          <button class="${state.arrastre===false?'on-des':''}" onclick="setArrastre(false)">No</button>
        </div>
      </div>
      <p class="ayuda">Activado, lo que te sobra o te falta de un mes se suma al siguiente, como una cuenta real. Así, si cargás gastos de junio, te bajan del saldo de julio. Para que dé bien, cargá el sueldo de cada mes que tenga gastos. Apagado, cada mes va por separado.</p>
    </div>

    <h2>Mis categorías</h2>
    <div class="card">
      ${cats().map(c=>`<div class="gest-item">
        <div class="gi-ico" style="background:${c.c}22">${c.em}</div>
        <span class="gi-nom">${escape(c.n)}</span>
        <button class="gi-x" onclick="renombrarCategoria('${c.k}')" style="color:var(--violeta)">✎</button>
        ${c.k!=='varios'?`<button class="gi-x" onclick="borrarCategoria('${c.k}')">×</button>`:''}
      </div>`).join('')}
      <button class="btn btn-sec" onclick="agregarCategoria()" style="margin-top:12px">＋ Agregar categoría</button>
      <p class="ayuda">Acá armás tus rubros. Por ejemplo, creá "Seguros/PAS" para separar lo de rendir. Si borrás una que tiene gastos, esos pasan a "Varios".</p>
    </div>

    <h2>Mis atajos</h2>
    <div class="card">
      ${(state.atajos&&state.atajos.length)?state.atajos.map(a=>{const c=catDe(a.categoria);return `<div class="gest-item">
        <div class="gi-ico" style="background:${c.c}22">${c.em}</div>
        <span class="gi-nom">${escape(a.desc)||c.n} · <b style="font-variant-numeric:tabular-nums">${plata(a.monto)}</b></span>
        <button class="gi-x" onclick="borrarAtajo(${a.id})">×</button>
      </div>`;}).join(''):'<p class="ayuda" style="margin:0">Todavía no creaste atajos. Se crean desde el "＋ Nuevo" en Inicio.</p>'}
    </div>

    <h2>Tus datos</h2>
    <div class="card">
      <button class="btn btn-sec" onclick="exportar()">⬇️ Descargar copia de seguridad</button>
      <label class="btn btn-sec" style="display:block;text-align:center;">⬆️ Importar copia
        <input type="file" accept="application/json" style="display:none" onchange="importar(event)">
      </label>
      <button class="btn btn-peli" onclick="borrarTodo()">🗑️ Borrar todo</button>
      <p class="ayuda">Tus datos viven solo en este teléfono. Si limpiás los datos del navegador se borran, así que de vez en cuando descargá una copia.${usaLocal?'':' <b style="color:var(--ambar)">Atención: este navegador no está guardando los datos, se perderán al cerrar. Probá abrir el archivo en Chrome.</b>'}</p>
    </div>
    <p class="ayuda" style="text-align:center;padding:10px 0 20px;">Mis Gastos · hecho para vos, sin publicidad 🧉</p>
  </div>`;
}
function guardarSueldo(){ /* obsoleto: el sueldo ahora se carga por mes desde Inicio */ }
function setArrastre(v){ state.arrastre=v; guardar(); toast(v?'Arrastre activado':'Meses separados'); render(); }
function exportar(){
  const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='mis-gastos-'+hoyStr()+'.json'; a.click();
}
function importar(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ state=JSON.parse(r.result); guardar(); toast('Datos importados'); render(); }catch(_){ toast('Archivo inválido'); } };
  r.readAsText(f);
}
function borrarTodo(){
  if(confirm('¿Seguro que querés borrar todo? Esto no se puede deshacer.')){
    state={sueldo:0,movs:[]}; guardar(); toast('Todo borrado'); render();
  }
}

// ============================================================
//  HOJA PARA CARGAR MOVIMIENTOS
// ============================================================
let nuevoTipo='gasto', nuevaCat='comida', nuevoNec=true, nuevoMedio='efectivo', editandoId=null;
const MEDIOS=[['efectivo','Efectivo'],['debito','Débito'],['tarjeta','Tarjeta']];
function abrirHoja(){
  editandoId=null;
  nuevoTipo='gasto'; nuevaCat='comida'; nuevoNec=true; nuevoMedio='efectivo';
  document.getElementById('inMonto').value='';
  document.getElementById('inDesc').value='';
  document.getElementById('inFecha').value=hoyStr();
  document.getElementById('hojaTitulo').textContent='Nuevo movimiento';
  document.getElementById('btBorrarMov').style.display='none';
  document.querySelector('#hoja .btn-pri').textContent='Guardar';
  renderCats(); renderMedios(); setTipo('gasto'); setND(true);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('hoja').classList.add('show');
  setTimeout(()=>document.getElementById('inMonto').focus(),300);
}
// Abre la hoja ya cargada con los datos de un movimiento, para editarlo.
function editarMov(id){
  const m=state.movs.find(x=>x.id===id); if(!m) return;
  editandoId=id;
  nuevoTipo=m.tipo; nuevaCat=m.categoria||'comida';
  nuevoNec=m.nec!==false; nuevoMedio=m.medio||'efectivo';
  document.getElementById('inMonto').value=m.monto;
  document.getElementById('inDesc').value=m.desc||'';
  document.getElementById('inFecha').value=m.fecha||hoyStr();
  document.getElementById('hojaTitulo').textContent='Editar movimiento';
  document.getElementById('btBorrarMov').style.display='block';
  document.querySelector('#hoja .btn-pri').textContent='Guardar cambios';
  renderCats(); renderMedios(); setTipo(m.tipo); setND(nuevoNec);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('hoja').classList.add('show');
}
function cerrarHoja(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('hoja').classList.remove('show');
}
function setTipo(t){
  nuevoTipo=t;
  document.getElementById('btGasto').classList.toggle('on',t==='gasto');
  document.getElementById('btIngreso').classList.toggle('on',t==='ingreso');
  document.getElementById('zonaGasto').style.display = t==='gasto'?'block':'none';
}
function setND(v){
  nuevoNec=v;
  document.getElementById('swNec').classList.toggle('on-nec',v);
  document.getElementById('swDes').classList.toggle('on-des',!v);
}
function renderCats(){
  document.getElementById('cats').innerHTML=cats().map(c=>
    `<div class="cat-chip ${c.k===nuevaCat?'on':''}" onclick="setCat('${c.k}')">${c.em} ${c.n}</div>`).join('');
}
function setCat(k){nuevaCat=k;renderCats();}
function renderMedios(){
  document.getElementById('medios').innerHTML=MEDIOS.map(([k,n])=>
    `<button class="${k===nuevoMedio?'on':''}" onclick="setMedio('${k}')">${n}</button>`).join('');
}
function setMedio(k){nuevoMedio=k;renderMedios();}
function guardarMov(){
  const monto=parseFloat(document.getElementById('inMonto').value);
  if(!monto||monto<=0){toast('Poné un monto');return;}
  const datos={
    tipo:nuevoTipo,
    monto:monto,
    desc:document.getElementById('inDesc').value.trim(),
    fecha:document.getElementById('inFecha').value||hoyStr(),
    categoria:nuevoTipo==='gasto'?nuevaCat:'varios',
    nec:nuevoTipo==='gasto'?nuevoNec:true,
    medio:nuevoTipo==='gasto'?nuevoMedio:'efectivo',
  };
  if(editandoId){
    const m=state.movs.find(x=>x.id===editandoId);
    if(m) Object.assign(m,datos);
    toast('Cambios guardados');
  }else{
    state.movs.push({id:Date.now(),...datos});
    toast(nuevoTipo==='gasto'?'Gasto cargado':'Ingreso cargado');
  }
  guardar(); cerrarHoja();
  if(detModo) renderDetalle();
  render();
}
function borrarDesdeHoja(){
  if(editandoId && confirm('¿Borrar este movimiento?')){
    state.movs=state.movs.filter(m=>m.id!==editandoId);
    guardar(); cerrarHoja();
    if(detModo) renderDetalle();
    toast('Borrado'); render();
  }
}
function borrar(id){
  if(confirm('¿Borrar este movimiento?')){
    state.movs=state.movs.filter(m=>m.id!==id); guardar();
    if(detModo) renderDetalle();
    toast('Borrado'); render();
  }
}

// ============================================================
//  ATAJOS (gastos repetitivos de un toque)
// ============================================================
let atCat='comida', atNec=true, atMedio='efectivo';
function abrirAtajoHoja(){
  atCat=(cats()[0]&&cats()[0].k)||'comida'; atNec=true; atMedio='efectivo';
  document.getElementById('atDesc').value=''; document.getElementById('atMonto').value='';
  atRenderCats(); atRenderMedios(); atSetND(true);
  document.getElementById('atOverlay').classList.add('show');
  document.getElementById('atHoja').classList.add('show');
}
function cerrarAtajoHoja(){
  document.getElementById('atOverlay').classList.remove('show');
  document.getElementById('atHoja').classList.remove('show');
}
function atRenderCats(){
  document.getElementById('atCats').innerHTML=cats().map(c=>
    `<div class="cat-chip ${c.k===atCat?'on':''}" onclick="atSetCat('${c.k}')">${c.em} ${c.n}</div>`).join('');
}
function atSetCat(k){atCat=k;atRenderCats();}
function atSetND(v){atNec=v;
  document.getElementById('atNec').classList.toggle('on-nec',v);
  document.getElementById('atDes').classList.toggle('on-des',!v);
}
function atRenderMedios(){
  document.getElementById('atMedios').innerHTML=MEDIOS.map(([k,n])=>
    `<button class="${k===atMedio?'on':''}" onclick="atSetMedio('${k}')">${n}</button>`).join('');
}
function atSetMedio(k){atMedio=k;atRenderMedios();}
function guardarAtajo(){
  const monto=parseFloat(document.getElementById('atMonto').value);
  const desc=document.getElementById('atDesc').value.trim();
  if(!monto||monto<=0){toast('Poné un monto');return;}
  state.atajos.push({id:Date.now(),desc:desc,monto:monto,categoria:atCat,nec:atNec,medio:atMedio});
  guardar(); cerrarAtajoHoja(); toast('Atajo creado'); render();
}
// Un toque: carga el gasto del atajo con fecha de hoy.
function usarAtajo(id){
  const a=state.atajos.find(x=>x.id===id); if(!a)return;
  state.movs.push({id:Date.now(),tipo:'gasto',monto:a.monto,desc:a.desc,fecha:hoyStr(),
    categoria:a.categoria,nec:a.nec!==false,medio:a.medio||'efectivo'});
  guardar(); toast('✓ '+(a.desc||'Gasto')+' cargado'); render();
}
function borrarAtajo(id){ state.atajos=state.atajos.filter(a=>a.id!==id); guardar(); toast('Atajo borrado'); render(); }

// ============================================================
//  GESTIÓN DE CATEGORÍAS
// ============================================================
function agregarCategoria(){
  const n=prompt('Nombre de la categoría nueva (ej: Seguros/PAS):'); if(!n||!n.trim())return;
  const em=(prompt('Un emoji para la categoría (ej: 🛡️):','🏷️')||'🏷️').trim().slice(0,2);
  const k='c'+Date.now();
  const c=PALETA[(state.cats.length)%PALETA.length];
  state.cats.push({k:k,n:n.trim(),em:em,c:c});
  guardar(); toast('Categoría agregada'); render();
}
function renombrarCategoria(k){
  const cat=state.cats.find(c=>c.k===k); if(!cat)return;
  const n=prompt('Nuevo nombre:',cat.n); if(n&&n.trim())cat.n=n.trim();
  const em=prompt('Emoji:',cat.em); if(em&&em.trim())cat.em=em.trim().slice(0,2);
  guardar(); if(detModo)renderDetalle(); toast('Categoría actualizada'); render();
}
function borrarCategoria(k){
  if(k==='varios'){toast('Esa no se puede borrar');return;}
  const enUso=state.movs.filter(m=>m.categoria===k).length;
  const msg=enUso?`Hay ${enUso} gasto(s) en esta categoría. Si la borrás, pasan a "Varios". ¿Seguir?`:'¿Borrar esta categoría?';
  if(confirm(msg)){
    state.movs.forEach(m=>{ if(m.categoria===k)m.categoria='varios'; });
    state.cats=state.cats.filter(c=>c.k!==k);
    guardar(); toast('Categoría borrada'); render();
  }
}

// --- utilidades ---
function var2(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function escape(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT;
function toast(m){
  const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

// --- arranque ---
cargar(); render();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{})); }
</script>
